name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" py3Dmol
      - run: python -m pytest -q
      - run: python scripts/construir_notebook.py && git diff --exit-code notebooks/
