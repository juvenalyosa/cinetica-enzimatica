7.21 438.21" fill="none" stroke="#898781" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#fl898781)"/><path d="M 579.02 429.27 Q 559.94 413.31 546.79 392.21" fill="none" stroke="#898781" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#fl898781)"/><path d="M 555.73 264.02 Q 571.69 244.94 592.79 231.79" fill="none" stroke="#898781" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#fl898781)"/><circle cx="650" cy="217" r="13" fill="#2a78d6"/><text x="650" y="177" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="middle">1. Posiciones</text><text x="650" y="196" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">dónde está cada átomo</text><circle cx="768" cy="335" r="13" fill="#eb6834"/><text x="790" y="331" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">2. Fuerzas</text><text x="790" y="350" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">resortes + cargas + choques</text><circle cx="650" cy="453" r="13" fill="#4a3aa7"/><text x="650" y="495" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="middle">3. Aceleración</text><text x="650" y="514" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="middle">a = F / m</text><circle cx="532" cy="335" r="13" fill="#1baf7a"/><text x="510" y="331" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="end">4. Mover 2 fs</text><text x="510" y="350" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="end">posición nueva</text><text x="650" y="331" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="middle">×500 000</text><text x="650" y="353" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="middle">vueltas = 1 ns</text></svg>
