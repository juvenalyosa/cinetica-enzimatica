"'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="middle">insulina liberada</text><circle cx="735" cy="252" r="9" fill="#1baf7a"/><circle cx="765" cy="268" r="9" fill="#1baf7a"/><circle cx="795" cy="252" r="9" fill="#1baf7a"/><circle cx="825" cy="268" r="9" fill="#1baf7a"/><circle cx="855" cy="252" r="9" fill="#1baf7a"/><circle cx="885" cy="268" r="9" fill="#1baf7a"/><circle cx="915" cy="252" r="9" fill="#1baf7a"/><text x="815" y="310" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">más glucosa → más insulina</text><rect x="50" y="375" width="890" height="66.08" rx="12" fill="#fdf0eb"/><rect x="50" y="375" width="6" height="66.08" rx="3" fill="#eb6834"/><text x="72" y="403.32" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">Si una mutación frena a la glucoquinasa, el páncreas «ve» menos glucosa de la que hay: diabetes GCK-MODY.</text><text x="72" y="422.9" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="start">Si la acelera, libera insulina de más: hipoglucemia congénita.</text></svg>
