<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect x="1" y="1" width="998" height="638" rx="22" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><rect x="40" y="11" width="83.88" height="30" rx="15" fill="#e6e3f3"/><circle cx="55" cy="26" r="5" fill="#4a3aa7"/><text x="67" y="31" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#52514e" text-anchor="start">MODEL</text><text x="40" y="96" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#0b0b0b" text-anchor="start">From ΔE‡ to ΔG‡: three questions a good scientist asks</text><text x="40" y="126" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Each question is an extra calculation; only the first changes the number, the others say how much to trust it</text><rect x="40" y="160" width="296" height="250" rx="16" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/><circle cx="70" cy="192" r="15" fill="#1baf7a"/><text x="70" y="198" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text><text x="94" y="198" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">What about vibrations?</text><text x="64" y="368" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">atoms are never still:</text><text x="64" y="386.2" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">zero-point energy and entropy</text><circle cx="118" cy="275" r="22" fill="#76cfaf"/><circle cx="258" cy="275" r="22" fill="#76cfaf"/><path d="M 140.0 275.0 L 151.5 275.0 L 155.6 285.0 L 163.7 265.0 L 171.8 285.0 L 179.9 265.0 L 188.0 285.0 L 196.1 265.0 L 204.2 285.0 L 212.3 265.0 L 220.4 285.0 L 224.5 275.0 L 236.0 275.0" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 93.2 258.1 A 30 30 0 0 0 93.2 291.9" fill="none" stroke="#898781" stroke-width="1.8" opacity="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M 85.8 253.0 A 39 39 0 0 0 85.8 297.0" fill="none" stroke="#898781" stroke-width="1.8" opacity="0.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M 78.4 247.9 A 48 48 0 0 0 78.4 302.1" fill="none" stroke="#898781" stroke-width="1.8" opacity="0.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 282.8 258.1 A 30 30 0 0 1 282.8 291.9" fill="none" stroke="#898781" stroke-width="1.8" opacity="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M 290.2 253.0 A 39 39 0 0 1 290.2 297.0" fill="none" stroke="#898781" stroke-width="1.8" opacity="0.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M 297.6 247.9 A 48 48 0 0 1 297.6 302.1" fill="none" stroke="#898781" stroke-width="1.8" opacity="0.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="352" y="160" width="296" height="250" rx="16" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/><circle cx="382" cy="192" r="15" fill="#2a78d6"/><text x="382" y="198" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text><text x="406" y="198" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Another enzyme pose?</text><text x="376" y="368" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">repeat on 4 snapshots from</text><text x="376" y="386.2" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">the MD (250–1000 ps)</text><path d="M 420 305 Q 500 345 580 305 Z" fill="#bfd6f3" opacity="0.35" stroke-linejoin="round" stroke-linecap="round"/><path d="M 420.0 295.0 Q 480.6 222.7 572.2 245.6" fill="none" stroke="#b4d0f1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M 420 305 Q 500 345 580 305 Z" fill="#bfd6f3" opacity="0.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M 420.0 295.0 Q 492.3 234.4 578.4 272.7" fill="none" stroke="#7faee6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M 420 305 Q 500 345 580 305 Z" fill="#bfd6f3" opacity="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M 420.0 295.0 Q 501.7 247.8 579.9 300.6" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="500" cy="297" r="9" fill="#eb6834"/><rect x="664" y="160" width="296" height="250" rx="16" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/><circle cx="694" cy="192" r="15" fill="#e87ba4"/><text x="694" y="198" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text><text x="718" y="198" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">What if the method is wrong?</text><text x="688" y="368" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">recompute with PM6-D3H4 on</text><text x="688" y="386.2" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">the same geometries</text><text x="688" y="235" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">PM7</text><rect x="688" y="245" width="153.02" height="18" rx="5" fill="#52514e"/><text x="849.02" y="260" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">19.1 kcal/mol</text><text x="688" y="291" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="start">PM6-D3H4</text><rect x="688" y="301" width="36.34" height="18" rx="5" fill="#e87ba4"/><text x="732.34" y="316" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">4.5 kcal/mol</text><text x="40" y="470" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Only question 1 corrects the barrier (kcal/mol, 25 °C):</text><rect x="40" y="492" width="150" height="50" rx="12" fill="#eeeeed"/><rect x="40" y="536" width="150" height="6" rx="3" fill="#898781"/><text x="115" y="525" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="20" font-weight="400" fill="#0b0b0b" text-anchor="middle">ΔE‡ 19.13</text><text x="207" y="526" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#52514e" text-anchor="middle">+</text><rect x="224" y="492" width="150" height="50" rx="12" fill="#dff4ec"/><rect x="224" y="536" width="150" height="6" rx="3" fill="#1baf7a"/><text x="299" y="525" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="20" font-weight="400" fill="#0b0b0b" text-anchor="middle">ΔZPE −0.24</text><text x="391" y="526" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#52514e" text-anchor="middle">+</text><rect x="408" y="492" width="150" height="50" rx="12" fill="#e6e3f3"/><rect x="408" y="536" width="150" height="6" rx="3" fill="#4a3aa7"/><text x="483" y="525" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="20" font-weight="400" fill="#0b0b0b" text-anchor="middle">ΔH<tspan dy="5.6" font-size="13.6">vib</tspan><tspan dy="-5.6">​</tspan> −0.43</text><text x="575" y="526" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#52514e" text-anchor="middle">+</text><rect x="592" y="492" width="150" height="50" rx="12" fill="#fcedf2"/><rect x="592" y="536" width="150" height="6" rx="3" fill="#e87ba4"/><text x="667" y="525" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="20" font-weight="400" fill="#0b0b0b" text-anchor="middle">−TΔS‡ +1.29</text><text x="759" y="526" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#52514e" text-anchor="middle">=</text><rect x="776" y="492" width="150" height="50" rx="12" fill="#fceae3"/><rect x="776" y="536" width="150" height="6" rx="3" fill="#eb6834"/><text x="851" y="525" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="20" font-weight="400" fill="#0b0b0b" text-anchor="middle">ΔG‡ 19.75</text><text x="40" y="590" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">The breaking spring loses its vibration (ΔZPE &lt; 0 lowers the barrier); the transition state is</text><text x="40" y="608.2" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">stiffer than the reactant (ΔS‡ &lt; 0), so −TΔS‡ raises it. The two almost cancel.</text></svg>
