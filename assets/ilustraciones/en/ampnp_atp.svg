<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><defs><marker id="fleb6834" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker><marker id="fl0b0b0b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0b0b0b"/></marker></defs><rect x="1" y="1" width="998" height="358" rx="22" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><rect x="40" y="11" width="143.69" height="30" rx="15" fill="#eeeeed"/><circle cx="55" cy="26" r="5" fill="#898781"/><text x="67" y="31" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#52514e" text-anchor="start">THINK ABOUT IT</text><text x="40" y="96" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#0b0b0b" text-anchor="start">The crystallographer’s trick: an ATP that cannot react</text><text x="40" y="126" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Changing one atom (O3B → N3B) freezes the complex just before the chemistry</text><rect x="60" y="150" width="400" height="185" rx="16" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/><text x="84" y="185" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">AMP-PNP (in the crystal)</text><text x="84" y="207" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">the N bridge doesn’t break: no reaction</text><line x1="90" y1="270" x2="150" y2="270" stroke="#52514e" stroke-width="3.2" stroke-linecap="round"/><line x1="150" y1="270" x2="235" y2="270" stroke="#52514e" stroke-width="3.2" stroke-linecap="round"/><line x1="235" y1="270" x2="320" y2="270" stroke="#52514e" stroke-width="3.2" stroke-linecap="round"/><circle cx="150" cy="270" r="22" fill="#f5cb73" stroke="#eda100" stroke-width="2"/><text x="150" y="275.76" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="17.92" font-weight="600" fill="#0b0b0b" text-anchor="middle">Pβ</text><circle cx="320" cy="270" r="22" fill="#f5cb73" stroke="#eda100" stroke-width="2"/><text x="320" y="275.76" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="17.92" font-weight="600" fill="#0b0b0b" text-anchor="middle">Pγ</text><circle cx="235" cy="270" r="16" fill="#b7b0dc" stroke="#4a3aa7" stroke-width="2"/><text x="235" y="275.4" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">N</text><path d="M 394.2 264 L 394.2 253.2 A 10.799999999999999 10.799999999999999 0 0 1 415.8 253.2 L 415.8 264" fill="none" stroke="#52514e" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="388.2" y="261.6" width="33.6" height="26.4" rx="4.8" fill="#52514e"/><circle cx="405" cy="273.6" r="3.6" fill="#ffffff"/><rect x="540" y="150" width="400" height="185" rx="16" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/><text x="564" y="185" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">ATP (in our simulation)</text><text x="564" y="207" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">the O bridge does break: it reacts</text><line x1="570" y1="270" x2="630" y2="270" stroke="#52514e" stroke-width="3.2" stroke-linecap="round"/><line x1="630" y1="270" x2="715" y2="270" stroke="#52514e" stroke-width="3.2" stroke-linecap="round"/><line x1="715" y1="270" x2="800" y2="270" stroke="#52514e" stroke-width="3.2" stroke-linecap="round"/><circle cx="630" cy="270" r="22" fill="#f5cb73" stroke="#eda100" stroke-width="2"/><text x="630" y="275.76" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="17.92" font-weight="600" fill="#0b0b0b" text-anchor="middle">Pβ</text><circle cx="800" cy="270" r="22" fill="#f5cb73" stroke="#eda100" stroke-width="2"/><text x="800" y="275.76" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="17.92" font-weight="600" fill="#0b0b0b" text-anchor="middle">Pγ</text><circle cx="715" cy="270" r="16" fill="#f8d999" stroke="#eda100" stroke-width="2"/><text x="715" y="275.4" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">O</text><line x1="737" y1="248" x2="755" y2="292" stroke="#e34948" stroke-width="3" stroke-linecap="round"/><path d="M 830 270 L 890 240" fill="none" stroke="#eb6834" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#fleb6834)"/><text x="860" y="298" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">to glucose</text><path d="M 465 262 L 530 262" fill="none" stroke="#0b0b0b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#fl0b0b0b)"/><text x="497" y="247" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">N → O</text></svg>
