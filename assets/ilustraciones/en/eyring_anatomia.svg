<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445"><rect x="1" y="1" width="998" height="443" rx="22" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><rect x="40" y="11" width="250.9" height="30" rx="15" fill="#e1ecf9"/><circle cx="55" cy="26" r="5" fill="#2a78d6"/><text x="67" y="31" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#52514e" text-anchor="start">THE EQUATION, TERM BY TERM</text><text x="40" y="96" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#0b0b0b" text-anchor="start">Eyring in words: rate = attempts × probability of success</text><text x="70" y="205" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="46" font-weight="400" fill="#0b0b0b" text-anchor="start">k</text><text x="110" y="205" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="40" font-weight="400" fill="#52514e" text-anchor="start">=</text><rect x="165" y="153" width="175" height="76" rx="14" fill="#e5effa"/><text x="252.5" y="207" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="32" font-weight="400" fill="#0b0b0b" text-anchor="middle">κ · k<tspan dy="8.96" font-size="21.76">B</tspan><tspan dy="-8.96">​</tspan>T / h</text><rect x="165" y="245" width="175" height="5" rx="2.5" fill="#2a78d6"/><text x="252.5" y="281" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="middle">attempts per second</text><text x="252.5" y="305" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="middle">the molecule “runs into”</text><text x="252.5" y="323.85" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="middle">the hill ~6 × 10<tspan dy="-5.51" font-size="9.86">12</tspan><tspan dy="5.51">​</tspan> times/s</text><text x="420" y="205" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="36" font-weight="400" fill="#52514e" text-anchor="middle">×</text><rect x="455" y="153" width="250" height="76" rx="14" fill="#fdede7"/><text x="580" y="207" font-family="'STIX Two Text', 'STIXGeneral', 'Times New Roman', serif" font-size="32" font-weight="400" fill="#0b0b0b" text-anchor="middle">exp(−ΔG<tspan dy="-12.16" font-size="21.76">‡</tspan><tspan dy="12.16">​</tspan> / RT)</text><rect x="455" y="245" width="250" height="5" rx="2.5" fill="#eb6834"/><text x="580" y="281" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="middle">probability of reaching the top</text><text x="580" y="305" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="middle">fraction of attempts with</text><text x="580" y="323.85" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#52514e" text-anchor="middle">enough energy (very small)</text><rect x="745" y="120" width="215" height="285" rx="16" fill="#ffffff" stroke="#e1e0d9" stroke-width="2"/><text x="765" y="155" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">Rule of thumb</text><text x="765" y="180" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">every extra 1.36 kcal/mol</text><text x="765" y="199.5" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">of hill ⇒ 10 times</text><text x="765" y="219" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#52514e" text-anchor="start">slower</text><rect x="775" y="370" width="38" height="12" rx="5" fill="#fce8e1"/><text x="794" y="362" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">×1</text><rect x="820" y="342" width="38" height="40" rx="5" fill="#fad9cc"/><text x="839" y="334" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">÷10</text><rect x="865" y="314" width="38" height="68" rx="5" fill="#f8cab8"/><text x="884" y="306" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">÷100</text><rect x="910" y="286" width="38" height="96" rx="5" fill="#f6bba4"/><text x="929" y="278" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">÷1000</text><text x="852" y="272" font-family="'Avenir Next', 'Avenir', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#898781" text-anchor="middle">higher barrier →</text></svg>
